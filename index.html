/* Layout: sticky map on the left, activity panel on the right; stacked on phones. Land is coloured by region. */
:root{

  --ff-b:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f161c; --panel:#18222b; --fg:#e6edf3; --muted:#9aabba; --line:#2d3b48;
    --sea:#0e1b26; --grid:#182937; --accent:#5aa9ff; --on-accent:#06121f;
    --ok:#35a96a; --bad:#e5594d; --other:#26323d; --plain:#2c3a47; --halo:#0f161c; --edge:#0a1117;
    --rN:#35607a; --rW:#4c7a3f; --rC:#8f7633; --rS:#8f5a45; --rB:#6c5a8c; --rE:#3b7a72;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161c; --panel:#18222b; --fg:#e6edf3; --muted:#9aabba; --line:#2d3b48;
  --sea:#0e1b26; --grid:#182937; --accent:#5aa9ff; --on-accent:#06121f;
  --ok:#35a96a; --bad:#e5594d; --other:#26323d; --plain:#2c3a47; --halo:#0f161c; --edge:#0a1117;
  --rN:#35607a; --rW:#4c7a3f; --rC:#8f7633; --rS:#8f5a45; --rB:#6c5a8c; --rE:#3b7a72;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--ff-b);margin:0;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:1180px;margin:0 auto}
h1{font:700 26px/1.15 var(--ff-h);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{margin:4px 0 0;color:var(--muted)}
.tabs{display:flex;gap:6px;margin:14px 0 14px;flex-wrap:wrap}
.tab{font:600 14px var(--ff-b);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:16px;align-items:start}
.mapcol{position:sticky;top:8px;z-index:5;min-width:0}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sea)}
#map{display:block;width:100%;height:auto;aspect-ratio:868/760;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map:active{cursor:grabbing}
.zoom{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px}
.zoom button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 18px/1 var(--ff-b);cursor:pointer}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:500 13px var(--ff-b);cursor:pointer}
.chip[aria-pressed="false"]{opacity:.5}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none;border:1px solid var(--edge)}
.dot.reg-N{background:var(--rN)}.dot.reg-W{background:var(--rW)}.dot.reg-C{background:var(--rC)}
.dot.reg-S{background:var(--rS)}.dot.reg-B{background:var(--rB)}.dot.reg-E{background:var(--rE)}

/* map elements */
.o path{fill:var(--other);stroke:var(--edge);stroke-width:.6;vector-effect:non-scaling-stroke}
.c.reg-N{--f:var(--rN)}.c.reg-W{--f:var(--rW)}.c.reg-C{--f:var(--rC)}
.c.reg-S{--f:var(--rS)}.c.reg-B{--f:var(--rB)}.c.reg-E{--f:var(--rE)}
.plain .c:not(.dim):not(.ok):not(.bad){--f:var(--plain)}
.c.dim{--f:var(--other)}
.c.ok{--f:var(--ok)}.c.bad{--f:var(--bad)}
.c path,.c.mk{fill:var(--f);stroke:var(--edge);stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer}
.c.sel path,.c.sel.mk{stroke:var(--accent);stroke-width:2.6}
.c.dim{cursor:default}
.lab text{font:600 11px var(--ff-b);fill:var(--fg);paint-order:stroke;stroke:var(--halo);stroke-width:3px;stroke-linejoin:round;text-anchor:middle;pointer-events:none}
.lab{pointer-events:none}
.bd{cursor:pointer}
.bd circle{fill:var(--accent);stroke:var(--halo);stroke-width:2px}
.bd text{font:700 12px var(--ff-b);fill:var(--on-accent);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.bd.on circle{stroke:var(--fg);stroke-width:2.5px}
.grid line{stroke:var(--grid);stroke-width:.6;vector-effect:non-scaling-stroke}

/* panel */
#panel{display:flex;flex-direction:column;gap:12px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.eyebrow{font:600 12px var(--ff-b);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qname{font:700 30px/1.15 var(--ff-h);margin:4px 0 6px;text-wrap:balance}
.fb{min-height:24px;font-weight:500}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.muted{color:var(--muted)}.small{font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}
.btn{padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:600 14px var(--ff-b);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn[hidden]{display:none}
input[type=text],input[type=search],select{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:15px var(--ff-b)}
select{width:auto}
.inl{display:flex;gap:8px;margin-top:6px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat b{display:block;font:700 22px var(--ff-h);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.li{display:grid;grid-template-columns:12px minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;width:100%;text-align:left;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--fg);font:14px var(--ff-b);cursor:pointer}
.li:last-child{border-bottom:0}
.li.on{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.li .lc{color:var(--muted)}
.li .lc.blur{filter:blur(6px);user-select:none}
.info h2{font:700 24px/1.2 var(--ff-h);margin:0 0 4px}
.info .cap{font-size:20px}
.sheet{display:flex;flex-direction:column;gap:8px}
.srow{display:grid;grid-template-columns:34px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.srow.ok{border-color:var(--ok)}.srow.bad{border-color:var(--bad)}
.num{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font:700 13px var(--ff-b);cursor:pointer}
.ans{grid-column:2 / 4;font-size:13px;color:var(--muted)}
.ans b{color:var(--fg)}
.mark{font-weight:700}
.mark.ok{color:var(--ok)}.mark.bad{color:var(--bad)}.mark.near{color:#b7791f}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .mapcol{top:0;background:var(--bg);padding-bottom:6px}
  .list{max-height:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

/* ---------- storage and helpers ---------- */
function sget(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function norm(s){return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'')}
function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=1;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function grade(inp,answers){var x=norm(inp);if(!x)return 0;var best=0;
  for(var i=0;i<answers.length;i++){var y=norm(answers[i]);if(x===y)return 2;if(y.length>=6&&lev(x,y)<=1)best=1}return best}

    if(v){if(labelSet)v=labelSet.has(c.id);else v=c.micro?z>=3.2:(c.bw/s>=l.len*5.8)}

      for(var i=0;i<placed.length;i++){var q=placed[i];if(Math.abs(sx-q[0])<hw+q[2]&&Math.abs(sy-q[1])<hh+q[3]){v=false;break}}

function animateVB(t){

  (function step(now){var k=Math.min(1,(now-t0)/260),e=1-Math.pow(1-k,3);
    setVB({x:s.x+(t.x-s.x)*e,y:s.y+(t.y-s.y)*e,w:s.w+(t.w-s.w)*e,h:s.h+(t.h-s.h)*e});

}

  if(m==='learn')learnInit();else if(m==='point')pointInit();else testInit();
}
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(b)setMode(b.dataset.mode)});
function onRegionChange(){if(mode==='learn')learnInit(true);else if(mode==='point')pointStart();else testNew()}
function onMapTap(t){
  if(!t||!t.closest)return;
  var bd=t.closest('[data-b]');if(bd&&mode==='test'){testFocus(bd.dataset.b,true);return}
  var el=t.closest('[data-id]');if(!el)return;
  var id=el.dataset.id,c=byId[id];if(!c||c.dim)return;
  if(mode==='learn')learnPick(id,true);else if(mode==='point')pointPick(id);
}

/* ---------- LEARN ---------- */
var L={hide:false,q:'',sel:null};
function learnInit(keep){
  dimFn=function(c){return !R.has(c.r)};
  labelsOn=sessionLabels;labelSet=null;
  if(!keep){L.sel=null}
  panel.innerHTML=
   '<div class="card info" id="info" aria-live="polite"></div>'+
   '<div class="card"><div class="row"><label class="chk"><input type="checkbox" id="lNames"'+(sessionLabels?' checked':'')+'> Nimed kaardil</label>'+
   '<label class="chk"><input type="checkbox" id="lHide"'+(L.hide?' checked':'')+'> Varja pealinnad</label></div>'+
   '<p class="muted small" style="margin:8px 0 0">Suurenda kaarti, et näha väikeseid riike. Vatikan, San Marino, Monaco, Andorra, Liechtenstein ja Malta on punktid.</p></div>'+
   '<input id="lSearch" type="search" placeholder="Otsi riiki või pealinna" autocomplete="off" spellcheck="false" value="'+L.q+'">'+
   '<ul class="list" id="lList"></ul>';
  $('#lNames').addEventListener('change',function(e){sessionLabels=labelsOn=e.target.checked;refreshLabels()});
  $('#lHide').addEventListener('change',function(e){L.hide=e.target.checked;learnList();learnInfo()});
  $('#lSearch').addEventListener('input',function(e){L.q=e.target.value;learnList()});
  $('#lList').addEventListener('click',function(e){var b=e.target.closest('.li');if(!b)return;
    var lc=b.querySelector('.lc');if(L.hide&&lc)lc.classList.remove('blur');learnPick(b.dataset.id,true,true)});
  applyDim();learnList();learnInfo();
  if(L.sel)select(L.sel);
}
var sessionLabels=true;
function learnList(){
  var q=norm(L.q),items=DATA.filter(function(c){return R.has(c.r)&&(!q||norm(c.n).indexOf(q)>-1||norm(c.c).indexOf(q)>-1)})
    .sort(function(a,b){return a.n.localeCompare(b.n,'et')});
  $('#lList').innerHTML=items.map(function(c){
    return '<li><button class="li'+(L.sel===c.id?' on':'')+'" data-id="'+c.id+'"><i class="dot reg-'+c.r+'"></i><span>'+c.n+'</span><span class="lc'+(L.hide&&L.sel!==c.id?' blur':'')+'">'+c.c+'</span></button></li>'}).join('')||'<li class="muted" style="padding:12px">Midagi ei leitud.</li>';
}
function learnInfo(){
  var el=$('#info');if(!el)return;
  if(!L.sel){el.innerHTML='<div class="eyebrow">Õppimine</div><p style="margin:6px 0 0">Vajuta kaardil riigile või vali nimekirjast. Siis näed nime ja pealinna.</p>';return}
  var c=byId[L.sel];
  el.innerHTML='<div class="eyebrow">'+REG[c.r]+'</div><h2>'+c.n+'</h2><div class="cap">Pealinn: <b>'+c.c+'</b></div>';
}
function learnPick(id,fromMap,fromList){
  L.sel=id;select(id);learnInfo();
  document.querySelectorAll('.li').forEach(function(b){var on=b.dataset.id===id;b.classList.toggle('on',on);
    if(on){var lc=b.querySelector('.lc');if(lc)lc.classList.remove('blur');if(fromMap)b.scrollIntoView({block:'nearest'})}});
  if(fromList||byId[id].micro)focusOn(id);
}

/* ---------- POINT ---------- */
var P={q:[],i:0,cur:null,phase:'idle',score:0,tot:0,streak:0,askCap:true,weakOnly:false,timer:0,msg:'',kind:''};
function pointInit(){
  dimFn=function(c){return !R.has(c.r)};labelsOn=true;labelSet=new Set();
  panel.innerHTML=
   '<div class="card"><div class="eyebrow" id="pProg"></div><div class="qname" id="pQ"></div><div class="fb" id="pFb" role="status" aria-live="polite"></div>'+
   '<form id="pCap" hidden autocomplete="off"><label for="pCapIn" class="muted small">Mis on pealinn?</label><div class="inl"><input type="text" id="pCapIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Pealinn"><button class="btn pri" type="submit">Kontrolli</button></div></form>'+
   '<div class="row" style="margin-top:10px"><button class="btn" id="pSkip" type="button">Ei tea</button><button class="btn pri" id="pNext" type="button" hidden>Edasi</button></div></div>'+
   '<div class="card stats"><div class="stat"><b id="sScore">0</b><span>õigeid</span></div><div class="stat"><b id="sTot">0</b><span>vastatud</span></div><div class="stat"><b id="sStreak">0</b><span>seeria</span></div></div>'+
   '<div class="card"><label class="chk"><input type="checkbox" id="oCap"'+(P.askCap?' checked':'')+'> Küsi ka pealinna</label>'+
   '<label class="chk" style="margin-top:8px"><input type="checkbox" id="oWeak"'+(P.weakOnly?' checked':'')+'> Ainult need, mis on läinud valesti (<span id="wCount">0</span>)</label>'+
   '<div class="row" style="margin-top:10px"><button class="btn" id="pRestart" type="button">Alusta uuesti</button><button class="btn" id="pClear" type="button">Unusta vead</button></div></div>';
  $('#pCap').addEventListener('submit',function(e){e.preventDefault();pointCap()});
  $('#pSkip').addEventListener('click',pointSkip);
  $('#pNext').addEventListener('click',pointNext);
  $('#oCap').addEventListener('change',function(e){P.askCap=e.target.checked;pointStart()});
  $('#oWeak').addEventListener('change',function(e){P.weakOnly=e.target.checked;pointStart()});
  $('#pRestart').addEventListener('click',pointStart);
  $('#pClear').addEventListener('click',function(){weak.clear();saveWeak();P.weakOnly=false;$('#oWeak').checked=false;pointStart()});
  applyDim();pointStart();
}
function pointStart(){
  clearTimeout(P.timer);clearState();
  var pool=DATA.filter(function(c){return R.has(c.r)}).map(function(c){return c.id});
  if(P.weakOnly)pool=pool.filter(function(id){return weak.has(id)});
  P.q=shuffle(pool);P.i=0;P.score=0;P.tot=0;P.streak=0;
  animateVB(FULL);pointNext();
}
function pointNext(){
  clearTimeout(P.timer);clearState();labelSet=new Set();refreshLabels();
  if(P.i>=P.q.length){P.cur=null;P.phase='done';P.msg='';P.kind='';pointPaint();return}
  P.cur=byId[P.q[P.i++]];P.phase='ask';P.msg='';P.kind='';
  if(vb.w<W*0.99)animateVB(FULL);
  pointPaint();
}
function pointPaint(){
  var c=P.cur;
  $('#pProg').textContent=P.phase==='done'?'Valmis':'Näita kaardil · '+Math.min(P.i,P.q.length)+' / '+P.q.length;
  var q=$('#pQ');
  if(P.phase==='done'){q.textContent=P.q.length?('Tulemus '+P.score+' / '+P.q.length):'Siin pole küsimusi'}
  else q.textContent=c?c.n:'';
  var fb=$('#pFb');fb.textContent=P.msg||(P.phase==='done'?(P.q.length?(P.score===P.q.length?'Kõik õiged!':'Vajuta "Alusta uuesti" või harjuta ainult vigu.'):(P.weakOnly?'Vigu pole. Võta linnuke maha.':'Vali vähemalt üks piirkond.')):(P.phase==='ask'?'Vajuta kaardil õigele riigile.':''));
  fb.className='fb '+(P.kind||'');
  var cap=$('#pCap');cap.hidden=P.phase!=='cap';
  $('#pSkip').hidden=!(P.phase==='ask'||P.phase==='cap');
  var nx=$('#pNext');nx.hidden=P.phase!=='result';
  $('#sScore').textContent=P.score;$('#sTot').textContent=P.tot;$('#sStreak').textContent=P.streak;
  $('#wCount').textContent=weak.size;
  if(P.phase==='cap'){var i=$('#pCapIn');i.value='';i.focus({preventScroll:true})}
  if(P.phase==='result'){nx.focus({preventScroll:true})}
}
function pointDone(full,msg){
  var c=P.cur;P.phase='result';P.tot++;
  if(full){P.score++;P.streak++;weak.delete(c.id)}else{P.streak=0;weak.add(c.id)}
  saveWeak();labelSet=new Set([c.id]);refreshLabels();
  P.msg=msg;P.kind=full?'ok':'bad';pointPaint();
  if(full){var n=P.i;P.timer=setTimeout(function(){if(P.phase==='result'&&P.i===n)pointNext()},1200)}
}
function pointPick(id){
  if(P.phase!=='ask')return;var c=P.cur;
  if(id===c.id){
    clearState();setCls(c.id,'ok',true);
    if(P.askCap){P.phase='cap';P.msg='Õige! Mis on pealinn?';P.kind='ok';pointPaint()}
    else pointDone(true,'Õige! Pealinn: '+c.c+'.');
  }else{
    clearState();setCls(id,'bad',true);setCls(c.id,'ok',true);
    focusOn(c.id);
    pointDone(false,'See on '+byId[id].n+'. '+c.n+' on rohelisega. Pealinn: '+c.c+'.');
  }
}
function pointCap(){
  if(P.phase!=='cap')return;var c=P.cur,v=$('#pCapIn').value;
  var g=grade(v,capAns(c));
  if(g===2)pointDone(true,'Õige! '+c.c+'.');
  else if(g===1)pointDone(true,'Peaaegu. Õige kirjapilt on '+c.c+'.');
  else pointDone(false,'Pealinn on '+c.c+'.');
}
function pointSkip(){
  var c=P.cur;if(!c)return;
  if(P.phase==='ask'){clearState();setCls(c.id,'ok',true);focusOn(c.id);pointDone(false,'See on '+c.n+'. Pealinn: '+c.c+'.')}
  else if(P.phase==='cap')pointDone(false,'Pealinn on '+c.c+'.');
}

/* ---------- TEST ---------- */
var T={ids:[],num:{},n:10,checked:false,sel:null};
var badgeEls=[];
function clearBadges(){badgeEls.forEach(function(o){var i=sg.indexOf(o);if(i>-1)sg.splice(i,1);o.el.remove()});badgeEls=[]}
function testInit(){
  dimFn=function(c){return !T.set||!T.set.has(c.id)};labelsOn=false;labelSet=new Set();
  panel.innerHTML=
   '<div class="card"><div class="row between"><label class="chk">Riike <select id="tN">'+[10,15,20,30,47].map(function(n){return '<option value="'+n+'"'+(n===T.n?' selected':'')+'>'+(n===47?'Kõik':n)+'</option>'}).join('')+'</select></label>'+
   '<button class="btn" id="tNew" type="button">Uus test</button></div>'+
   '<p class="muted small" style="margin:8px 0 0">Kaardil on numbrid. Kirjuta iga numbri juurde riik ja pealinn. Numbri peale vajutades hüppab kursor reale.</p></div>'+
   '<div class="sheet" id="sheet"></div>'+
   '<div class="row"><button class="btn pri" id="tCheck" type="button">Kontrolli</button></div>'+
   '<div class="card" id="tRes" hidden aria-live="polite"></div>';
  $('#tN').addEventListener('change',function(e){T.n=+e.target.value;testNew()});
  $('#tNew').addEventListener('click',testNew);
  $('#tCheck').addEventListener('click',testCheck);
  testNew();
}
function testNew(){
  clearState();clearBadges();
  var pool=DATA.filter(function(c){return R.has(c.r)}).map(function(c){return c.id});
  T.ids=T.force?shuffle(T.force):shuffle(pool).slice(0,Math.min(T.n,pool.length));T.force=null;
  T.set=new Set(T.ids);T.num={};T.checked=false;T.sel=null;
  T.ids.forEach(function(id,i){T.num[id]=i+1});
  applyDim();
  T.ids.forEach(function(id){
    var c=byId[id],g=mk('g',{'class':'bd','data-b':id},gBd),dx=c.micro?15:0,dy=c.micro?-15:0;
    var inner=mk('g',{transform:'translate('+dx+' '+dy+')'},g);
    mk('circle',{r:11,cx:0,cy:0},inner);var t=mk('text',{x:0,y:0},inner);t.textContent=T.num[id];
    var o={el:g,x:c.ax,y:c.ay};sg.push(o);badgeEls.push(o);
  });
  refreshScale();
  var h='';
  T.ids.forEach(function(id){h+='<div class="srow" data-id="'+id+'"><div class="num" data-n="'+id+'">'+T.num[id]+'</div>'+
    '<input type="text" data-k="n" placeholder="Riik" aria-label="Riik nr '+T.num[id]+'" autocomplete="off" autocapitalize="off" spellcheck="false">'+
    '<input type="text" data-k="c" placeholder="Pealinn" aria-label="Pealinn nr '+T.num[id]+'" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'});
  $('#sheet').innerHTML=h||'<div class="card muted">Vali vähemalt üks piirkond.</div>';
  $('#tRes').hidden=true;
  var sh=$('#sheet');
  sh.onfocusin=function(e){var r=e.target.closest('.srow');if(r)testFocus(r.dataset.id,false)};
  sh.onclick=function(e){var n=e.target.closest('.num');if(n){testFocus(n.dataset.n,true);n.parentNode.querySelector('input').focus()}};
  sh.onkeydown=function(e){
    if(e.key!=='Enter')return;var t=e.target;if(t.tagName!=='INPUT')return;e.preventDefault();
    var all=Array.from(sh.querySelectorAll('input')),i=all.indexOf(t);if(all[i+1])all[i+1].focus();else $('#tCheck').focus();
  };
}
function testFocus(id,zoom){
  T.sel=id;
  badgeEls.forEach(function(o){o.el.classList.toggle('on',o.el.dataset.b===id)});
  DATA.forEach(function(c){c.els.forEach(function(e){e.classList.remove('sel')})});
  setCls(id,'sel',true);
  if(zoom){var r=document.querySelector('.srow[data-id="'+id+'"]');if(r)r.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});if(byId[id].micro)focusOn(id)}
}
function testCheck(){
  var okN=0,okC=0,wrongIds=[],rows=document.querySelectorAll('.srow');
  rows.forEach(function(r){
    var id=r.dataset.id,c=byId[id],ins=r.querySelectorAll('input');
    var gn=grade(ins[0].value,nameAns(c)),gc=grade(ins[1].value,capAns(c));
    if(gn)okN++;if(gc)okC++;
    var full=gn&&gc;
    r.classList.toggle('ok',!!full);r.classList.toggle('bad',!full);
    var old=r.querySelector('.ans');if(old)old.remove();
    var a=document.createElement('div');a.className='ans';
    var mkr=function(g){return g===2?'<span class="mark ok">✓</span>':g===1?'<span class="mark near">~</span>':'<span class="mark bad">✗</span>'};
    a.innerHTML=mkr(gn)+' '+mkr(gc)+' &nbsp;'+(full===2||(gn===2&&gc===2)?'':'Õige: <b>'+c.n+'</b> · <b>'+c.c+'</b>');
    r.appendChild(a);
    clearTestFill(id);setCls(id,full?'ok':'bad',true);
    if(full)weak.delete(id);else{weak.add(id);wrongIds.push(id)}
  });
  saveWeak();
  var n=T.ids.length,res=$('#tRes');res.hidden=false;
  res.innerHTML='<div class="eyebrow">Tulemus</div><div class="stats" style="margin-top:6px"><div class="stat"><b>'+okN+' / '+n+'</b><span>riigid</span></div><div class="stat"><b>'+okC+' / '+n+'</b><span>pealinnad</span></div></div>'+
    '<p class="muted small" style="margin:8px 0 0">✓ õige, ~ peaaegu (kirjaviga), ✗ vale. Valed lähevad harjutamiseks ka režiimi „Näita kaardil“.</p>'+
    '<div class="row" style="margin-top:10px">'+(wrongIds.length?'<button class="btn pri" id="tRetry" type="button">Korda ainult valesid ('+wrongIds.length+')</button>':'<span class="mark ok">Kõik õiged!</span>')+'<button class="btn" id="tAgain" type="button">Uus test</button></div>';
  var rt=$('#tRetry');if(rt)rt.addEventListener('click',function(){T.force=wrongIds.slice();testNew();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})});
  $('#tAgain').addEventListener('click',function(){testNew();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'})});
  T.checked=true;res.scrollIntoView({block:'nearest',behavior:reduce?'auto':'smooth'});
}
function clearTestFill(id){setCls(id,'ok',false);setCls(id,'bad',false)}

/* ---------- start ---------- */
renderBar();applyPlain();
setVB(FULL);
learnInit();
})();
</script>
